# Workflow security analysis with zizmor. Maintainer notes:
# https://main--docsydocs.netlify.app/project/about/maintainer-notes/#workflow-security-analysis

name: zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '45 9 * * 5' # weekly: refreshes the online audits' advisory data
  workflow_dispatch:
permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    with: { persona: pedantic }
